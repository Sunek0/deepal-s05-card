name: Release

# Creates a GitHub release automatically whenever CARD_VERSION in src/00_head.js
# is bumped on main (tag = v<CARD_VERSION>). Notes come from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - "src/00_head.js"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: bash scripts/build.sh
      - name: Release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(grep -oP 'CARD_VERSION = "\K[^"]+' src/00_head.js)"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do"
            gh release upload "$tag" dist/deepal-s05-card.js --clobber
            exit 0
          fi
          awk -v ver="$v" '$0 ~ "^## "ver"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $tag" > notes.md
          gh release create "$tag" dist/deepal-s05-card.js --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
